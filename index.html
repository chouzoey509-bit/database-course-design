<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拾光 · 校园二手市场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f3ec; --surface:#fffdf9; --ink:#23201b; --muted:#8c8475;
    --line:#e8e1d4; --line-2:#f0ebe0;
    --accent:#d94f33; --accent-d:#bf412a; --accent-soft:#fbe9e3;
    --pine:#2f5d50; --pine-soft:#e4ede9;
    --gold:#b5791f; --gold-soft:#f6ecd8;
    --ok:#2f7d57; --ok-bg:#e4f1e9; --err:#c0392b; --err-bg:#fbe7e4;
    --radius:14px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(35,32,27,.05), 0 12px 30px -16px rgba(35,32,27,.22);
    --shadow-sm:0 1px 2px rgba(35,32,27,.06);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Fraunces",Georgia,"Songti SC",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(rgba(35,32,27,.022) 1px, transparent 1px);
    background-size:22px 22px;
  }
  a{color:inherit}
  button{font-family:inherit}
  .hidden{display:none !important}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    transition:.15s ease;white-space:nowrap;line-height:1}
  .btn:hover{border-color:#d8cfbd;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
  .btn-pine{background:var(--pine);border-color:var(--pine);color:#fff}
  .btn-pine:hover{filter:brightness(1.06)}
  .btn-danger{background:#fff;border-color:#eccac2;color:var(--err)}
  .btn-danger:hover{background:var(--err-bg)}
  .btn-ghost{background:transparent;border-color:transparent}
  .btn-ghost:hover{background:var(--line-2);border-color:transparent;transform:none}
  .btn-sm{padding:6px 12px;font-size:13px}
  .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}

  label.lab{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.02em}
  .field, select.field, textarea.field{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 13px;font-size:14.5px;color:var(--ink);font-family:inherit;transition:.15s}
  .field:focus,select.field:focus,textarea.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.field{resize:vertical;min-height:84px;line-height:1.5}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:700;letter-spacing:.02em}
  .b-pub{background:var(--pine-soft);color:var(--pine)}
  .b-end{background:#efe9dd;color:#8a7f68}
  .b-rem{background:var(--err-bg);color:var(--err)}
  .b-active{background:var(--ok-bg);color:var(--ok)}
  .b-disabled{background:var(--err-bg);color:var(--err)}
  .b-admin{background:var(--gold-soft);color:var(--gold)}
  .b-user{background:#eee9de;color:#857c69}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .auth-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--shadow);padding:34px 32px 26px;position:relative;overflow:hidden}
  .auth-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;
    background:linear-gradient(90deg,var(--accent),var(--gold) 60%,var(--pine))}
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .brand .mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:23px;font-weight:600;
    box-shadow:0 6px 14px -6px var(--accent)}
  .brand h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;letter-spacing:.01em}
  .brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:1px;font-family:var(--sans)}
  .tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin:22px 0 20px}
  .tabs .tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-weight:600;font-size:14px;
    cursor:pointer;color:var(--muted);border:none;background:transparent;transition:.15s}
  .tabs .tab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
  .auth-form{display:flex;flex-direction:column;gap:14px}
  .api-box{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
  .api-box summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;list-style:none}
  .api-box summary::-webkit-details-marker{display:none}
  .api-box summary:hover{color:var(--ink)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .seed-hint{margin-top:14px;background:var(--pine-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--pine);line-height:1.6}
  .seed-hint b{font-weight:700}

  .nav{position:sticky;top:0;z-index:30;background:rgba(246,243,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:12px 22px}
  .nav .logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:600;font-size:21px;margin-right:14px;cursor:pointer}
  .nav .logo .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
  .nav-links{display:flex;gap:2px;align-items:center;flex:1}
  .nav-link{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:transparent;transition:.15s}
  .nav-link:hover{color:var(--ink);background:var(--line-2)}
  .nav-link.on{color:var(--accent);background:var(--accent-soft)}
  .nav-link.admin.on{color:var(--gold);background:var(--gold-soft)}
  .nav-user{display:flex;align-items:center;gap:10px}
  .nav-user .who{text-align:right;line-height:1.2}
  .nav-user .who .name{font-weight:700;font-size:14px}
  .nav-user .who .role{font-size:11.5px;color:var(--muted)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--pine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}

  .wrap{max-width:1140px;margin:0 auto;padding:26px 22px 70px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .page-head h2{font-family:var(--serif);font-weight:600;font-size:30px;margin:0;letter-spacing:.01em}
  .page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

  .filter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;box-shadow:var(--shadow-sm)}
  .filter .fcol{display:flex;flex-direction:column;min-width:130px}
  .filter .fcol.grow{flex:1;min-width:200px}
  .filter .fcol .lab{margin-bottom:5px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
  .item-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
  .item-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#ddd3c1}
  .item-card .thumb{aspect-ratio:4/3;background:var(--line-2);position:relative;overflow:hidden}
  .item-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .item-card .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cdc4b2;font-family:var(--serif);font-size:13px;letter-spacing:.04em}
  .item-card .disc{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;box-shadow:0 4px 10px -4px var(--accent)}
  .item-card .body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
  .item-card .nm{font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}
  .item-card .cat{font-size:12px;color:var(--muted)}
  .price-line{display:flex;align-items:baseline;gap:8px;margin-top:auto}
  .price{font-family:var(--serif);font-weight:600;color:var(--accent);font-size:21px}
  .price .y{font-size:14px;margin-right:1px}
  .orig{color:var(--muted);text-decoration:line-through;font-size:12.5px}
  .views{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-family:var(--serif);font-size:20px;color:#b3a994;margin-bottom:6px}
  .loading{text-align:center;padding:50px;color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .card-pad{padding:22px}
  .stack{display:flex;flex-direction:column;gap:16px}

  .listing{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
  .listing .lthumb{width:78px;height:78px;border-radius:10px;background:var(--line-2);object-fit:cover;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#cdc4b2;font-size:11px}
  .listing .lthumb img{width:100%;height:100%;object-fit:cover}
  .listing .linfo{flex:1;min-width:0}
  .listing .linfo .lnm{font-weight:600;font-size:15.5px;margin-bottom:3px}
  .listing .linfo .lmeta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .listing .lprice{font-family:var(--serif);color:var(--accent);font-weight:600;font-size:18px}
  .listing .lacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

  .overlay{position:fixed;inset:0;background:rgba(35,32,27,.42);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:.18s}
  .overlay.show{opacity:1}
  .modal{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.4);transform:translateY(10px);transition:.18s}
  .overlay.show .modal{transform:translateY(0)}
  .modal .mhead{position:relative}
  .modal .mimg{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line-2);display:block}
  .modal .mimg.ph{display:flex;align-items:center;justify-content:center;color:#cdc4b2;font-family:var(--serif)}
  .modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
  .modal .mbody{padding:22px 24px 24px}
  .modal h3{font-family:var(--serif);font-weight:600;font-size:23px;margin:0 0 10px;line-height:1.3}
  .seller{margin-top:18px;background:var(--pine-soft);border-radius:12px;padding:14px 16px}
  .seller .sl{font-size:12px;color:var(--pine);font-weight:700;letter-spacing:.03em;margin-bottom:6px}
  .seller .srow{display:flex;justify-content:space-between;align-items:center;font-size:14.5px}
  .desc{margin-top:14px;color:#4a463d;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
  .pricebox{display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}
  .pricebox .big{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--accent)}

  .form-card{max-width:620px;margin:0 auto}
  .uploader{border:1.5px dashed var(--line);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:#fff;position:relative}
  .uploader:hover{border-color:var(--accent);background:var(--accent-soft)}
  .uploader.has{padding:0;border-style:solid;overflow:hidden}
  .uploader img{width:100%;max-height:230px;object-fit:cover;display:block}
  .uploader .upico{font-size:26px;color:#c9bfac}
  .uploader .uptxt{color:var(--muted);font-size:13px;margin-top:6px}
  .uploader .clearimg{position:absolute;top:8px;right:8px;background:rgba(35,32,27,.7);color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
  .calc{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  .calc .cl{font-size:13px;color:var(--accent-d);font-weight:600}
  .calc .cv{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent)}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .subtab{padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
  .subtab:hover{color:var(--ink)}
  .subtab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
  .tbl-wrap.scroll{overflow-x:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th{text-align:left;background:var(--line-2);color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.03em;padding:11px 14px;white-space:nowrap}
  table.tbl td{padding:11px 14px;border-top:1px solid var(--line-2);vertical-align:middle}
  table.tbl tr:hover td{background:#fffaf2}
  .mono{font-variant-numeric:tabular-nums}

  #toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center}
  .toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(12px);transition:.3s;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{background:var(--pine)}
  .toast.err{background:var(--err)}

  @media (max-width:720px){
    .nav-inner{flex-wrap:wrap;padding:10px 14px;gap:8px}
    .nav-links{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
    .nav-user .who{display:none}
    .wrap{padding:20px 14px 60px}
    .page-head h2{font-size:24px}
    .grid-2{grid-template-columns:1fr}
    .listing{flex-wrap:wrap}
    .listing .lacts{width:100%;justify-content:flex-start}
  }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="mark">拾</div>
      <div><h1>拾光</h1><small>校园二手物品交易平台</small></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabLogin" onclick="switchAuth('login')">登录</button>
      <button class="tab" id="tabReg" onclick="switchAuth('reg')">注册</button>
    </div>

    <div id="loginForm" class="auth-form">
      <div>
        <label class="lab">用户名</label>
        <input class="field" id="li_user" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div>
        <label class="lab">密码</label>
        <input class="field" id="li_pass" type="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn btn-primary" style="margin-top:4px" id="loginBtn" onclick="doLogin()">登 录</button>
      <div class="seed-hint">
        测试账号 · 管理员 <b>admin / admin123</b><br>
        普通用户 <b>zhangsan / 123456</b> · <b>lisi / 123456</b>
      </div>
    </div>

    <div id="regForm" class="auth-form hidden">
      <div class="grid-2">
        <div><label class="lab">用户名 *</label><input class="field" id="rg_user" placeholder="登录用户名"></div>
        <div><label class="lab">手机号 *</label><input class="field" id="rg_phone" placeholder="联系手机号"></div>
      </div>
      <div><label class="lab">密码 *</label><input class="field" id="rg_pass" type="password" placeholder="设置登录密码"></div>
      <div class="grid-2">
        <div><label class="lab">真实姓名</label><input class="field" id="rg_name" placeholder="选填"></div>
        <div><label class="lab">邮箱</label><input class="field" id="rg_email" placeholder="选填"></div>
      </div>
      <button class="btn btn-primary" style="margin-top:4px" id="regBtn" onclick="doRegister()">注 册</button>
    </div>

    <details class="api-box" id="apiBox">
      <summary>⚙ 后端接口地址设置</summary>
      <div style="margin-top:10px">
        <input class="field" id="apiInput" placeholder="http://localhost:8000">
        <div class="hint">前端通过此地址访问 FastAPI 后端。本地默认 http://localhost:8000；部署后填你的服务器地址。修改后点保存。</div>
        <button class="btn btn-sm" style="margin-top:8px" onclick="saveApi()">保存地址</button>
      </div>
    </details>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appView" class="hidden">
  <nav class="nav">
    <div class="nav-inner">
      <div class="logo" onclick="go('browse')"><span class="mark">拾</span> 拾光</div>
      <div class="nav-links" id="navLinks"></div>
      <div class="nav-user">
        <div class="who"><div class="name" id="navName"></div><div class="role" id="navRole"></div></div>
        <div class="avatar" id="navAvatar"></div>
        <button class="btn btn-sm btn-ghost" onclick="logout()">退出</button>
      </div>
    </div>
  </nav>
  <div class="wrap" id="main"></div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* ========== 状态 & 工具 ========== */
const DEFAULT_API = "http://localhost:8000";
const getAPI = () => (localStorage.getItem("cm_api") || DEFAULT_API).replace(/\/+$/,"");
let TOKEN = localStorage.getItem("cm_token") || "";
let USER  = JSON.parse(localStorage.getItem("cm_user") || "null");
let CATS  = [];
let CURRENT_VIEW = "browse";

function saveSession(t,u){ TOKEN=t; USER=u; localStorage.setItem("cm_token",t); localStorage.setItem("cm_user",JSON.stringify(u)); }
function clearSession(){ TOKEN=""; USER=null; localStorage.removeItem("cm_token"); localStorage.removeItem("cm_user"); }

function toast(msg,type="ok"){
  const t=document.createElement("div"); t.className="toast "+type; t.textContent=msg;
  document.getElementById("toasts").appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),320);},2600);
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ return "¥"+Number(n).toFixed(2); }
function imgUrl(u){ if(!u) return ""; return /^https?:\/\//.test(u) ? u : getAPI()+u; }
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return s; const p=x=>String(x).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }

async function api(path,{method="GET",body=null,form=null,auth=true}={}){
  const headers={};
  if(auth && TOKEN) headers["Authorization"]="Bearer "+TOKEN;
  const opts={method,headers};
  if(form){ opts.body=form; }
  else if(body!=null){ headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  let res;
  try{ res=await fetch(getAPI()+path,opts); }
  catch(e){ throw new Error("无法连接后端，请检查接口地址与后端是否已启动（"+getAPI()+"）"); }
  let data=null; const txt=await res.text();
  if(txt){ try{ data=JSON.parse(txt); }catch(_){ data={detail:txt}; } }
  if(!res.ok){
    if(res.status===401 && auth){ clearSession(); showAuth(); throw new Error("登录已过期，请重新登录"); }
    let detail = data && (data.detail ?? data.message);
    if(Array.isArray(detail)) detail = detail.map(d=>d.msg||JSON.stringify(d)).join("；");
    throw new Error(detail || ("请求失败（"+res.status+"）"));
  }
  return data;
}

function buildNav(){

/* ========== 分类下拉 ========== */
function catOptions(selectedId,withAll){
  let out=withAll?`<option value="">全部分类</option>`:`<option value="">请选择分类</option>`;
  (function walk(list,depth){
    for(const c of (list||[])){
      const sel=String(c.category_id)===String(selectedId)?"selected":"";
      out+=`<option value="${c.category_id}" ${sel}>${"　".repeat(depth)}${esc(c.category_name)}</option>`;
      if(c.children&&c.children.length) walk(c.children,depth+1);
    }
  })(CATS,0);
  return out;
}
function statusBadge(s){
  return {PUBLISHING:`<span class="badge b-pub">在售</span>`,ENDED:`<span class="badge b-end">已成交</span>`,REMOVED:`<span class="badge b-rem">已下架</span>`}[s]||`<span class="badge b-end">${esc(s)}</span>`;
}

function clearImg(){ _uploadUrl=null; renderForm(getFormDraft()); }
function getFormDraft(){
  // 重新渲染表单时保留已填内容（编辑/清图场景）
  const g=id=>{const e=document.getElementById(id);return e?e.value:"";};
  return {item_name:g("fm_name"),category_id:g("fm_cat"),original_price:g("fm_orig"),discount:g("fm_disc"),description:g("fm_desc"),primary_image_url:_uploadUrl,
          // 标记为“草稿”以复用编辑分支的取值（item_id 不带则当作新建）
          __draft:true};
}
function calcSale(){
  const o=parseFloat(document.getElementById("fm_orig").value)||0;
  const d=parseFloat(document.getElementById("fm_disc").value)||0;
  document.getElementById("fm_sale").textContent=money(o*d/10);
}
async function onPickFile(ev){
  const file=ev.target.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ toast("请选择图片文件","err"); return; }
  if(file.size>5*1024*1024){ toast("图片不能超过 5MB","err"); return; }
  const up=document.getElementById("uploader");
  up.innerHTML=`<div class="upico">⏳</div><div class="uptxt">上传中…</div>`;
  try{
    const fd=new FormData(); fd.append("file",file);
    const d=await api("/api/upload/image",{method:"POST",form:fd});
    _uploadUrl=d.url;
    up.classList.add("has");
    up.innerHTML=`<img src="${imgUrl(_uploadUrl)}"><button class="clearimg" onclick="event.stopPropagation();clearImg()">✕</button>`;
    toast("图片上传成功");
  }catch(e){
    toast(e.message,"err");
    up.classList.remove("has");
    up.innerHTML=`<div class="upico">⤒</div><div class="uptxt">点击上传图片（JPG/PNG/WEBP，≤5MB）</div>`;
  }
  ev.target.value="";
}
async function submitForm(itemId){
  const name=document.getElementById("fm_name").value.trim();
  const cat=document.getElementById("fm_cat").value;
  const orig=parseFloat(document.getElementById("fm_orig").value);
  const disc=parseFloat(document.getElementById("fm_disc").value);
  const desc=document.getElementById("fm_desc").value.trim()||null;
  if(!name){ toast("请填写物品名称","err"); return; }
  if(!cat){ toast("请选择分类","err"); return; }
  if(!(orig>0)){ toast("请填写正确的原价","err"); return; }
  if(!(disc>0&&disc<=10)){ toast("折扣需在 0~10 之间（几折）","err"); return; }
  const payload={category_id:parseInt(cat),item_name:name,original_price:orig,discount:disc,description:desc,primary_image_url:_uploadUrl};
  const btn=document.getElementById("fm_submit"); btn.disabled=true; const old=btn.textContent; btn.textContent="提交中…";
  try{
    if(itemId){ await api(`/api/items/${itemId}`,{method:"PUT",body:payload}); toast("修改已保存"); go("mine"); }
    else { await api("/api/items",{method:"POST",body:payload}); toast("发布成功！"); go("mine"); }
  }catch(e){ toast(e.message,"err"); btn.disabled=false; btn.textContent=old; }
}

        .map(([k,t])=>`<button class="subtab ${k===ADMIN_TAB?'on':''}" onclick="setAdminTab('${k}')">${t}</button>`).join("")}
    </div>
    <div id="adminBody"><div class="loading">加载中…</div></div>`;
  setAdminTab(ADMIN_TAB);
}
function setAdminTab(tab){
  ADMIN_TAB=tab;
  document.querySelectorAll("#adminTabs .subtab").forEach(b=>b.classList.toggle("on",b.getAttribute("onclick").includes("'"+tab+"'")));
  ({users:adminUsers,items:adminItems,cats:adminCats,logs:adminLogs,slogs:adminSearchLogs}[tab]||adminUsers)();
}

async function adminUsers(){
  const box=document.getElementById("adminBody");
  try{
    const d=await api("/api/admin/users?page=1&page_size=100");
    box.innerHTML=`<div class="tbl-wrap scroll"><table class="tbl">
      <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th>成交</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody>${d.users.map(u=>`<tr>
        <td class="mono">${u.user_id}</td>
        <td><b>${esc(u.username)}</b></td>
        <td>${esc(u.real_name||"—")}</td>
        <td class="mono">${esc(u.phone||"—")}</td>
        <td>${u.role==="ADMIN"?'<span class="badge b-admin">管理员</span>':'<span class="badge b-user">用户</span>'}</td>
        <td>${u.status==="ACTIVE"?'<span class="badge b-active">正常</span>':'<span class="badge b-disabled">已禁用</span>'}</td>
        <td class="mono">${u.success_trade_count}</td>
        <td style="color:var(--muted)">${fmtDate(u.created_at)}</td>
        <td>${u.user_id===USER.user_id?'<span style="color:var(--muted);font-size:12px">本人</span>'
          : u.status==="ACTIVE"
            ? `<button class="btn btn-sm btn-danger" onclick="setUserStatus(${u.user_id},'DISABLED','${esc(u.username)}')">禁用</button>`
            : `<button class="btn btn-sm btn-pine" onclick="setUserStatus(${u.user_id},'ACTIVE','${esc(u.username)}')">启用</button>`}</td>
      </tr>`).join("")}</tbody></table></div>`;
  }catch(e){ box.innerHTML=`<div class="empty"><div class="big">出错了</div><div>${esc(e.message)}</div></div>`; }
}
async function setUserStatus(id,status,name){
  if(!confirm(`确认${status==="DISABLED"?"禁用":"启用"}用户「${name}」？`)) return;
  try{ const r=await api(`/api/admin/users/${id}/status`,{method:"PUT",body:{status}}); toast(r.message||"已更新"); adminUsers(); }
  catch(e){ toast(e.message,"err"); }
}

async function adminItems(){
  const box=document.getElementById("adminBody");
  box.innerHTML=`
    <div class="filter" style="margin-bottom:18px">
      <div class="fcol grow"><label class="lab">关键词</label><input class="field" id="ai_kw" placeholder="物品名称" onkeydown="if(event.key==='Enter')loadAdminItems()"></div>
      <div class="fcol"><label class="lab">状态</label>
        <select class="field" id="ai_status">
          <option value="">全部</option><option value="PUBLISHING">在售</option><option value="ENDED">已成交</option><option value="REMOVED">已下架</option>
        </select></div>
      <button class="btn btn-primary" onclick="loadAdminItems()">筛选</button>
    </div>
    <div id="aiList"><div class="loading">加载中…</div></div>`;
  loadAdminItems();
}
async function loadAdminItems(){
  const list=document.getElementById("aiList");
  const p=new URLSearchParams({page:"1",page_size:"100"});
  const kw=document.getElementById("ai_kw").value.trim(); const st=document.getElementById("ai_status").value;
  if(kw)p.set("keyword",kw); if(st)p.set("status",st);
  list.innerHTML=`<div class="loading">加载中…</div>`;
  try{
    const d=await api("/api/admin/items?"+p.toString());
    if(!d.items.length){ list.innerHTML=`<div class="empty"><div class="big">暂无数据</div></div>`; return; }
    list.innerHTML=`<div class="tbl-wrap scroll"><table class="tbl">
      <thead><tr><th>ID</th><th>物品名称</th><th>卖家</th><th>售价</th><th>浏览</th><th>状态</th><th>发布时间</th><th>操作</th></tr></thead>
      <tbody>${d.items.map(i=>`<tr>
        <td class="mono">${i.item_id}</td>
        <td><b>${esc(i.item_name)}</b></td>
        <td>${esc(i.owner_name||"—")}</td>
        <td class="mono" style="color:var(--accent)">${money(i.sale_price)}</td>
        <td class="mono">${i.view_count}</td>
        <td>${statusBadge(i.status)}</td>
        <td style="color:var(--muted)">${fmtDate(i.created_at)}</td>
        <td><div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-ghost" onclick="openItem(${i.item_id})">查看</button>
          ${i.status!=="REMOVED"?`<button class="btn btn-sm btn-danger" onclick="takeDown(${i.item_id},'${esc(i.item_name)}')">下架</button>`:""}
        </div></td>
      </tr>`).join("")}</tbody></table></div>`;
  }catch(e){ list.innerHTML=`<div class="empty"><div class="big">出错了</div><div>${esc(e.message)}</div></div>`; }
}
async function takeDown(id,name){
  const reason=prompt(`下架物品「${name}」的原因（可留空）：`,"违规");
  if(reason===null) return;
  try{ const r=await api(`/api/admin/items/${id}/take-down`,{method:"PUT",body:{reason:reason||"违规"}}); toast(r.message||"已下架"); loadAdminItems(); }
  catch(e){ toast(e.message,"err"); }
}

async function adminCats(){
  const box=document.getElementById("adminBody");
  try{
    CATS=await api("/api/categories",{auth:false});  // 刷新缓存
    box.innerHTML=`
      <div class="card card-pad" style="margin-bottom:18px">
        <div style="font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:12px">新增分类</div>
        <div class="filter" style="margin:0;border:none;padding:0;background:none">
          <div class="fcol grow"><label class="lab">分类名称</label><input class="field" id="nc_name" placeholder="如：运动器材"></div>
          <div class="fcol"><label class="lab">上级分类</label><select class="field" id="nc_parent"><option value="">无（作为顶级）</option>${catOptions("",false).replace('<option value="">请选择分类</option>','')}</select></div>
          <div class="fcol" style="min-width:90px"><label class="lab">排序</label><input class="field" id="nc_sort" type="number" value="0"></div>
          <button class="btn btn-primary" onclick="createCat()">新增</button>
        </div>
      </div>
      <div class="tbl-wrap scroll"><table class="tbl">
        <thead><tr><th>ID</th><th>分类名称</th><th>层级</th><th>排序</th><th>操作</th></tr></thead>
        <tbody id="catRows"></tbody>
      </table></div>`;
    const rows=[];
    (function walk(list,depth){ for(const c of (list||[])){
      rows.push(`<tr>
        <td class="mono">${c.category_id}</td>
        <td><b>${"　".repeat(depth)}${depth>0?'└ ':''}${esc(c.category_name)}</b></td>
        <td style="color:var(--muted)">${depth===0?"顶级":"子级"}</td>
        <td class="mono">${c.sort_order}</td>
        <td><div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="renameCat(${c.category_id},'${esc(c.category_name)}',${c.parent_id||'null'},${c.sort_order})">重命名</button>
          <button class="btn btn-sm btn-danger" onclick="disableCat(${c.category_id},'${esc(c.category_name)}')">禁用</button>
        </div></td>
      </tr>`);
      if(c.children) walk(c.children,depth+1);
    }})(CATS,0);
    document.getElementById("catRows").innerHTML = rows.join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">暂无分类</td></tr>`;
  }catch(e){ box.innerHTML=`<div class="empty"><div class="big">出错了</div><div>${esc(e.message)}</div></div>`; }
}
async function createCat(){
  const name=document.getElementById("nc_name").value.trim();
  const parent=document.getElementById("nc_parent").value;
  const sort=parseInt(document.getElementById("nc_sort").value)||0;
  if(!name){ toast("请填写分类名称","err"); return; }
  try{ await api("/api/categories",{method:"POST",body:{category_name:name,parent_id:parent?parseInt(parent):null,sort_order:sort}}); toast("分类已创建"); adminCats(); }
  catch(e){ toast(e.message,"err"); }
}
async function renameCat(id,oldName,parentId,sort){
  const name=prompt("修改分类名称：",oldName);
  if(name===null) return; const nm=name.trim(); if(!nm){ toast("名称不能为空","err"); return; }
  try{ await api(`/api/categories/${id}`,{method:"PUT",body:{category_name:nm,parent_id:parentId,sort_order:sort}}); toast("已更新"); adminCats(); }
  catch(e){ toast(e.message,"err"); }
}
async function disableCat(id,name){
  if(!confirm(`确认禁用分类「${name}」？禁用后将不再展示。`)) return;
  try{ await api(`/api/categories/${id}`,{method:"DELETE"}); toast("分类已禁用"); adminCats(); }
  catch(e){ toast(e.message,"err"); }
}

async function adminSearchLogs(){
  const box=document.getElementById("adminBody");
  try{
    const d=await api("/api/admin/search-logs?page=1&page_size=100");
    if(!d.logs.length){ box.innerHTML=`<div class="empty"><div class="big">暂无搜索记录</div></div>`; return; }
    box.innerHTML=`<div class="tbl-wrap scroll"><table class="tbl">
      <thead><tr><th>ID</th><th>用户ID</th><th>关键词</th><th>分类ID</th><th>时间</th></tr></thead>
      <tbody>${d.logs.map(l=>`<tr>
        <td class="mono">${l.search_id}</td>
        <td class="mono">${l.user_id??'<span style="color:var(--muted)">游客</span>'}</td>
        <td>${l.keyword?esc(l.keyword):'<span style="color:var(--muted)">—</span>'}</td>
        <td class="mono">${l.category_id??"—"}</td>
        <td style="color:var(--muted)">${fmtDate(l.searched_at)}</td>
      </tr>`).join("")}</tbody></table></div>`;
  }catch(e){ box.innerHTML=`<div class="empty"><div class="big">出错了</div><div>${esc(e.message)}</div></div>`; }
}

/* ========== 模态框 ========== */
function openModal(html){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  requestAnimationFrame(()=>root.firstElementChild.classList.add("show"));
}
function closeModal(){
  const ov=document.querySelector(".overlay");
  if(ov){ ov.classList.remove("show"); setTimeout(()=>document.getElementById("modalRoot").innerHTML="",180); }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* ========== 启动 ========== */
(async function init(){
  document.getElementById("apiInput").value = localStorage.getItem("cm_api")||DEFAULT_API;
  if(TOKEN && USER){
    try{
      const me=await api("/api/users/me");           // 验证 token 并刷新角色/状态
      USER={user_id:me.user_id,username:me.username,real_name:me.real_name,role:me.role};
      localStorage.setItem("cm_user",JSON.stringify(USER));
      await enterApp();
      return;
    }catch(_){ clearSession(); }
  }
  showAuth();
})();
</script>
